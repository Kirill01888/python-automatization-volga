[project]
name = "python-test-automatization-volga"
version = "0.1.0"
description = "UI-автотесты (Selenium + pytest) для кейса Volga-IT"
requires-python = "==3.13.*"

# ---------------------------------------------------------------- Ruff
[tool.ruff]
# target-version не указан: Ruff берёт его из requires-python (py313)
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort — сортировка импортов
    "B",       # flake8-bugbear — вероятные баги
    "UP",      # pyupgrade — современный синтаксис
    "PT",      # flake8-pytest-style — ошибки в тестах и фикстурах
    "SIM",     # flake8-simplify — упрощения
    "N",       # pep8-naming — именование
    "RUF",     # правила самого Ruff
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках, docstring'ах и комментариях
    "N812",  # from selenium...support import expected_conditions as EC — общепринятая запись
]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "pages", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
